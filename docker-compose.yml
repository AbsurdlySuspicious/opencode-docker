services:

  opencode-isolated:
    build:
      context: .
      dockerfile: Dockerfile
    # image: opencode-isolated:latest
    container_name: opencode-isolated

    networks:
      - default

    volumes:
      - ${WORKSPACE_PATH:-./workspace}:/workspace
      - ${WORKSPACE_PATH:-./workspace}/.git:/workspace/.git:ro
      - ./data/config:/home/opencode/.config/opencode
      - ./data/share:/home/opencode/.local/share/opencode
      - ./data/state:/home/opencode/.local/state/opencode
      # - /tmp/.X11-unix:/tmp/.X11-unix:ro

    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - path: .env
        required: false
    environment:
      - HOME=/home/opencode
      - DISPLAY=${DISPLAY:-:0}
      - TERM=${TERM:-xterm-256color}
      - COLORTERM=${COLORTERM:-truecolor}
      # UTF-8 locale so the TUI renders box-drawing/wide characters correctly
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      # Pin XDG dirs to mounted volumes so auth + sessions persist across restarts
      - XDG_DATA_HOME=/home/opencode/.local/share
      - XDG_CONFIG_HOME=/home/opencode/.config
      - OPENCODE_CHANNEL=latest
      - EDITOR=vim

    security_opt:
      - no-new-privileges:true
    user: ${UID:-1000}:${GID:-1000}
    stdin_open: true
    tty: true

